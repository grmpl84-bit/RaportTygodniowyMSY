<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raport Tygodniowy MSY</title>
<style>
  :root{
    --bg: #F5F2EC;
    --panel: #FFFFFF;
    --ink: #24303B;
    --ink-soft: #5C6B77;
    --line: #E1DBCC;
    --accent: #D97B1F;
    --accent-dark: #B3630F;
    --accent-soft: #FBEBD9;
    --good: #2F7D5C;
    --good-soft: #E3F1EA;
    --danger: #B4432F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding-bottom:96px;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    background:var(--ink);
    color:#fff;
    padding:18px 16px 16px;
    position:sticky;
    top:0;
    z-index:20;
  }
  header h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:0.2px;
  }
  header .sub{
    margin-top:3px;
    font-size:12.5px;
    color:#B9C2CA;
  }
  .kw-badge{
    display:inline-block;
    margin-top:8px;
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:12.5px;
    padding:4px 10px;
    border-radius:20px;
    letter-spacing:0.4px;
  }
  main{ padding:14px 12px 20px; max-width:640px; margin:0 auto; }
  .group-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink-soft);
    margin:22px 4px 8px;
  }
  .group-label:first-child{ margin-top:6px; }
  .item{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 12px 10px;
    margin-bottom:10px;
  }
  .item-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    margin-bottom:8px;
  }
  .item-name{ font-size:15px; font-weight:700; line-height:1.25; }
  .item-code{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; font-variant-numeric:tabular-nums; }
  .item-total{
    flex-shrink:0;
    text-align:right;
    background:var(--accent-soft);
    color:var(--accent-dark);
    font-weight:700;
    font-size:14px;
    padding:5px 9px;
    border-radius:8px;
    font-variant-numeric:tabular-nums;
    min-width:56px;
  }
  .item-total.filled{ background:var(--good-soft); color:var(--good); }
  .entry{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex:1;
    min-width:88px;
  }
  .field label{ font-size:10.5px; color:var(--ink-soft); font-weight:600; }
  .field input{
    width:100%;
    font-size:16px;
    padding:9px 8px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#FBFAF7;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .field input:focus{ outline:2px solid var(--accent); outline-offset:0; background:#fff; }
  .field select{
    width:100%;
    font-size:16px;
    padding:9px 8px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#FBFAF7;
    color:var(--ink);
  }
  .field select:focus{ outline:2px solid var(--accent); outline-offset:0; background:#fff; }
  .del-btn{
    flex-shrink:0;
    width:34px;
    height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--danger);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    align-self:flex-end;
    margin-bottom:1px;
  }
  .add-btn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:2px;
    background:none;
    border:1px dashed var(--line);
    color:var(--ink-soft);
    font-size:12.5px;
    font-weight:600;
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
  }
  .add-btn:active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); }

  footer{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    z-index:30;
    box-shadow:0 -4px 14px rgba(0,0,0,0.06);
  }
  .footer-inner{ max-width:640px; margin:0 auto; display:flex; gap:8px; }
  .btn{
    flex:1;
    padding:13px 10px;
    border-radius:10px;
    font-size:14.5px;
    font-weight:700;
    border:none;
    cursor:pointer;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:active{ background:var(--accent-dark); }
  .btn-secondary{ background:#F0ECE2; color:var(--ink-soft); flex:0 0 auto; padding:13px 14px; }
  .toast{
    position:fixed;
    bottom:78px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff;
    padding:10px 16px; border-radius:20px;
    font-size:13.5px; font-weight:600;
    z-index:40; opacity:0; pointer-events:none;
    transition:opacity 0.2s;
  }
  .toast.show{ opacity:1; }
  .progress{ font-size:12px; color:var(--ink-soft); text-align:center; margin-bottom:6px; }

  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(20,24,28,0.45);
    z-index:50;
    display:none;
  }
  .sheet-overlay.open{ display:block; }
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--panel);
    border-radius:16px 16px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    max-width:640px;
    margin:0 auto;
    z-index:51;
    transform:translateY(100%);
    transition:transform 0.22s ease;
  }
  .sheet-overlay.open .sheet{ transform:translateY(0); }
  .sheet h2{ margin:0 0 4px; font-size:16px; }
  .sheet .sheet-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }
  .sheet-section-label{
    font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.6px; color:var(--ink-soft); margin:14px 0 6px;
  }
  .sheet-btn{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left;
    background:#FBFAF7; border:1px solid var(--line);
    border-radius:10px; padding:12px 12px;
    font-size:14.5px; font-weight:600; color:var(--ink);
    margin-bottom:8px; cursor:pointer;
  }
  .sheet-btn:active{ background:var(--accent-soft); border-color:var(--accent); }
  .sheet-btn .icon{ font-size:17px; width:22px; text-align:center; flex-shrink:0; }
  .sheet-btn .lbl-sub{ display:block; font-size:11.5px; font-weight:400; color:var(--ink-soft); margin-top:1px; }
  .sheet-close{
    display:block; width:100%; text-align:center;
    background:none; border:none; color:var(--ink-soft);
    font-size:13.5px; font-weight:600; padding:10px 0 2px; cursor:pointer;
  }
  .sheet-btn.danger{
    background:#FBEDEA; border-color:#E7B6AB; color:var(--danger);
  }
  .copy-textarea{
    width:100%;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;
    line-height:1.4;
    color:var(--ink-soft);
    background:#FBFAF7;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
    resize:none;
    margin-bottom:8px;
  }
  .copy-btn.copied{ background:var(--good-soft); border-color:var(--good); color:var(--good); }
  /* Nowy, responsywny wygląd — bez zewnętrznych bibliotek. */
  :root{--bg:#f3f6fb;--panel:#fff;--ink:#19283e;--ink-soft:#62738b;--line:#dce4ef;--accent:#315de6;--accent-dark:#2345b3;--accent-soft:#edf2ff;--good:#18795c;--good-soft:#e7f6ef;--danger:#c14249;}
  body{background:radial-gradient(ellipse at top right,#e7eeff 0,transparent 55%),var(--bg);padding-bottom:112px;}
  header{background:rgba(255,255,255,.94);color:var(--ink);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);padding:22px max(20px,calc((100vw - 900px)/2));box-shadow:0 3px 18px #20365705;}
  header h1{font-size:23px;letter-spacing:-.65px;padding-right:92px;}
  header .sub{color:var(--ink-soft);line-height:1.5;margin-top:6px;}
  .kw-badge{position:absolute;right:max(20px,calc((100vw - 900px)/2));top:23px;margin:0;background:var(--accent-soft);color:var(--accent);border:1px solid #d9e2ff;padding:7px 12px;border-radius:10px;}
  main{max-width:940px;padding:22px 20px 30px;}
  .progress{display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;margin:0 0 22px;font-size:13px;font-weight:600;background:#ffffffb3;padding:14px 16px;border:1px solid var(--line);border-radius:14px;}
  .progress::after{content:'';width:30%;height:6px;border-radius:9px;background:linear-gradient(to right,var(--accent) var(--completion,0%),#e5ebf5 var(--completion,0%));}
  #itemsRoot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start;}
  .group-label{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:16px 0 0;font-size:11px;letter-spacing:1.3px;}
  .group-label::after{content:'';height:1px;background:var(--line);flex:1;}
  .item{margin:0;padding:18px;border-radius:17px;border:1px solid #e1e8f2;box-shadow:0 4px 18px #20365705;transition:border-color .18s,box-shadow .18s;min-width:0;}
  .item:focus-within{border-color:#aabdf8;box-shadow:0 4px 22px #315de610;}
  .item-head{margin-bottom:16px;gap:12px;}
  .item-name{font-size:14px;line-height:1.45;}
  .item-code{margin-top:4px;font-size:11px;letter-spacing:.4px;}
  .item-total{padding:8px 11px;border-radius:10px;font-size:16px;}
  .entry{gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #eef2f7;}
  .field{min-width:105px;gap:6px;}
  .field label{font-size:10px;line-height:1.4;}
  .field input,.field select{background:#f7f9fc;border-color:#e1e7f0;border-radius:9px;padding:10px;min-height:43px;}
  .field input:focus,.field select:focus{outline:2px solid #aabdf8;}
  .del-btn{height:43px;width:34px;background:#fff7f7;border-color:#f6dfe1;color:var(--danger);margin:0;}
  .add-btn{border:0;color:var(--accent);background:var(--accent-soft);padding:8px 11px;font-size:11px;}
  footer{background:rgba(255,255,255,.95);backdrop-filter:blur(16px);padding:14px 20px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 25px #20365708;}
  .footer-inner{max-width:900px;gap:12px;}
  .btn{border-radius:12px;padding:15px 18px;font-size:14px;min-height:48px;}
  .btn-primary{box-shadow:0 4px 10px #315de626;}
  .btn-secondary{background:#edf1f7;color:var(--ink-soft);}
  button{font-family:inherit;transition:background .18s,box-shadow .18s;}
  button:focus-visible{outline:3px solid #97adf5;outline-offset:3px;}
  .sheet-overlay{background:#14213a66;backdrop-filter:blur(5px);}
  .sheet{max-height:90dvh;overflow-y:auto;max-width:620px;padding:24px 22px calc(20px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;box-shadow:0 -12px 60px #14213a26;}
  .sheet h2{font-size:21px;letter-spacing:-.5px;}
  .sheet-sub{line-height:1.6;}
  .sheet-btn,.copy-textarea{background:#f7f9fc;border-color:var(--line);border-radius:12px;}
  .sheet-btn{padding:14px;}
  .sheet-btn.copy-btn{background:var(--accent-soft);border-color:#d7e1ff;color:var(--accent);}
  .sheet-close{padding:14px 0 3px;}
  .toast{bottom:94px;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 6px 24px #14213a26;}
  @media(max-width:680px){#itemsRoot{grid-template-columns:minmax(0,1fr);}header{padding:19px 16px;}header h1{font-size:20px;}.kw-badge{right:16px;top:18px;}main{padding:18px 14px 24px;}.item{padding:16px;}footer{padding-left:14px;padding-right:14px;}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important;}}

  /* Czytelność i obsługa dotykowa na urządzeniach mobilnych. */
  header .sub{font-size:15px;color:#495b73;}
  .kw-badge{font-size:14px;}
  .progress{font-size:15px;color:#495b73;line-height:1.5;}
  .group-label{font-size:14px;letter-spacing:.6px;line-height:1.5;color:#495b73;}
  .item-name{font-size:18px;line-height:1.45;}
  .item-code{font-size:15px;line-height:1.5;color:#495b73;letter-spacing:.2px;}
  .item-total{font-size:20px;min-width:64px;}
  .field{min-width:130px;}
  .field label{font-size:14px;line-height:1.5;color:#495b73;}
  .field input,.field select{font-size:18px;min-height:48px;}
  .del-btn{min-width:48px;width:48px;height:48px;font-size:20px;}
  .add-btn{min-height:48px;font-size:15px;line-height:1.4;padding:12px;}
  .btn{min-height:52px;font-size:17px;}
  .sheet .sheet-sub{font-size:15px;color:#495b73;}
  .sheet-section-label{font-size:14px;line-height:1.5;color:#495b73;}
  .sheet-btn{min-height:52px;font-size:17px;}
  .sheet-btn .lbl-sub{font-size:14px;line-height:1.5;color:#495b73;overflow-wrap:anywhere;}
  .sheet-close{font-size:16px;min-height:48px;}
  .copy-textarea{font-size:16px;}
  .toast{font-size:16px;}
  .item-name,.item-code{overflow-wrap:anywhere;}
  @media(max-width:800px){#itemsRoot{grid-template-columns:minmax(0,1fr);}}
  @media(max-width:400px){
    header h1{font-size:20px;padding-right:0;}
    .kw-badge{position:static;display:inline-block;margin-top:10px;}
    .progress{flex-wrap:wrap;gap:10px;}
    .progress::after{width:100%;}
    .field{flex:1 1 100%;min-width:0;}
    .entry{justify-content:flex-end;}
    .item-head{gap:8px;}
    .btn{padding:13px 12px;}
  }

</style>
</head>
<body>

<header>
  <h1>Raport Tygodniowy MSY</h1>
  <div class="sub">Stan materiałów · Uzupełnij ilości i przygotuj raport</div>
  <div class="kw-badge" id="kwBadge">KW --</div>
</header>

<main>
  <div class="progress" id="progress"></div>
  <div id="itemsRoot"></div>
</main>

<div class="toast" id="toast"></div>

<footer>
  <div class="footer-inner">
    <button class="btn btn-secondary" id="clearBtn" title="Wyczyść wszystkie dane">Wyczyść</button>
    <button class="btn btn-primary" id="exportBtn">Wyślij raport</button>
  </div>
</footer>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <h2>Wyślij raport</h2>
    <div class="sheet-sub" id="sheetSub"></div>

    <button class="sheet-btn" id="btnDownloadCsv">
      <span class="icon">⬇</span>
      <span>Pobierz CSV</span>
    </button>

    <div class="sheet-section-label">Skopiuj do Excela</div>
    <textarea id="copyTextarea" class="copy-textarea" readonly rows="3"></textarea>
    <button class="sheet-btn copy-btn" id="btnCopy">
      <span class="icon">⧉</span>
      <span>Kopiuj wiersz<span class="lbl-sub">Zaznacz pierwszą komórkę w Excelu i naciśnij Ctrl+V</span></span>
    </button>

    <div class="sheet-section-label">Wyślij mailem do</div>
    <div id="mailRecipients"></div>

    <button class="sheet-close" id="sheetCloseBtn">Anuluj</button>
  </div>
</div>

<div class="sheet-overlay" id="confirmOverlay">
  <div class="sheet">
    <h2>Wyczyścić wszystkie dane?</h2>
    <div class="sheet-sub">Wszystkie wpisane ilości zostaną usunięte bezpowrotnie. Tej operacji nie można cofnąć.</div>
    <button class="sheet-btn danger" id="confirmClearBtn">
      <span class="icon">🗑</span>
      <span>Tak, wyczyść wszystko</span>
    </button>
    <button class="sheet-close" id="confirmCancelBtn">Anuluj</button>
  </div>
</div>

<script>
(function(){

  // ---------- KONFIGURACJA POZYCJI ----------
  // Kolejność w tej tablicy = kolejność kolumn w eksportowanym CSV.
  // "packages" opcjonalnie: opakowania zbiorcze z przelicznikiem na sztuki.
  // Każda pozycja ma zawsze też pole "luzem" (sztuki/rolki/arkusze poza pełnymi opakowaniami).
  const ITEMS = [
    // ---- GRUPA 1 ----
    { code:'5330279', name:'Naklejki małe białe',        unit:'rolki',  group:1 },
    { code:'2881789', name:'Naklejki małe czarne',       unit:'rolki',  group:1 },
    { code:'2814419', name:'Naklejki duże czarne',       unit:'rolki',  group:1 },
    { code:'8062689', name:'Naklejki duże białe',        unit:'rolki',  group:1 },
    { code:'6407923', name:'ANTIRU-PAPIER 1100x600',     unit:'cm',     group:1, ratioOptions:[1.8, 2.5], step:'0.1' },
    { code:'1134228', name:'Etikett 40',                 unit:'rolki',  group:1 },
    { code:'3724001', name:'Etikett 41',                 unit:'rolki',  group:1 },
    { code:'9049792', name:'Etikett 42',                 unit:'rolki',  group:1 },
    { code:'7803934', name:'ANTIRU-PAPIER 1140x700',     unit:'cm',     group:1, ratioOptions:[1.8, 2.5], step:'0.1' },
    { code:'4502451', name:'THERMO-FOL13/1166/450',      unit:'rolki',  group:1 },
    { code:'1484802', name:'THERMO-FOL12/1220/450',      unit:'rolki',  group:1 },
    // ---- 2 PUSTE KOLUMNY W CSV MIĘDZY GRUPAMI ----
    // ---- GRUPA 2 ----
    { code:'7838949', name:'Podnośnik AVENTOS [.]',      unit:'szt',    group:2,
      packages:[ {label:'Paleta (672)', mult:672}, {label:'Warstwa (96)', mult:96}, {label:'Skrzynka (24)', mult:24} ] },
    { code:'9549752', name:'Podnośnik AVENTOS [T]',      unit:'szt',    group:2,
      packages:[ {label:'Paleta (672)', mult:672}, {label:'Warstwa (96)', mult:96}, {label:'Skrzynka (24)', mult:24} ] },
    { code:'4638300', name:'Wellkarton 1028A',           unit:'szt',    group:2 },
    { code:'4606142', name:'Puferki małe',               unit:'szt',    group:2,
      packages:[ {label:'Kart. zbiorczy (67500)', mult:67500}, {label:'Kart. pojedynczy (2500)', mult:2500} ] },
    { code:'6277942', name:'Folia 49B (IP64)',           unit:'rolki',  group:2 },
    { code:'1640004', name:'PE-FOLIE64460/80W-DL (LM04)',unit:'rolki',  group:2 },
    { code:'1697611', name:'Worki 90B',                  unit:'szt',    group:2,
      packages:[ {label:'Karton (3300)', mult:3300} ] },
    { code:'6461253', name:'Worki 92B',                  unit:'szt',    group:2,
      packages:[ {label:'Karton (3500)', mult:3500} ] },
    { code:'2263466', name:'Karton 485A (SET)',          unit:'szt',    group:2 },
    { code:'7782169', name:'Instrukcja 110°',            unit:'szt',    group:2,
      packages:[ {label:'Warstwa (13 kart. × 3750)', mult:48750}, {label:'Karton (3750)', mult:3750} ] },
    { code:'4904245', name:'worek 78I',                  unit:'szt',    group:2 },
    { code:'1649432', name:'Worek 73G',                  unit:'szt',    group:2 },
    { code:'2063806', name:'Worek 76K',                  unit:'szt',    group:2 },
    { code:'5921456', name:'Worek 78K',                  unit:'szt',    group:2 },
  ];

  const STORAGE_KEY = 'msy_raport_v1';
  const UNIT_LABEL = { rolki:'Rolki', arkusze:'Arkusze', szt:'Sztuki', cm:'Cm' };
  const RECIPIENTS = [
    { name:'Magdalena Kamińska', email:'magdalena.kaminska@blum.com' },
    { name:'Tomasz Sobkowiak',   email:'tomasz.sobkowiak@blum.com' },
    { name:'Sebastian Baran',    email:'sebastian.baran@blum.com' },
  ];

  // ---------- STAN ----------
  // state[code] = [ {id, packQty:{0:n,1:n,...}, loose:n}, ... ]
  let state = loadState();

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {};
      return JSON.parse(raw);
    }catch(e){ return {}; }
  }
  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  function ensureItem(code){
    if(!state[code]) state[code] = [];
    return state[code];
  }
  function newEntry(item){
    const e = { id:newEntryId(), packQty:{}, loose:'' };
    if(item.ratioOptions) e.ratio = item.ratioOptions[0];
    return e;
  }
  function ensureMinimumEntry(item){
    const arr = ensureItem(item.code);
    if(arr.length === 0){
      arr.push(newEntry(item));
    }
    return arr;
  }
  function newEntryId(){
    return 'e' + Math.random().toString(36).slice(2,9);
  }
  function isEntryFilled(entry, item){
    if(entry.loose !== '' && entry.loose !== undefined && entry.loose !== null) return true;
    if(item.packages){
      for(const key in (entry.packQty || {})){
        const v = entry.packQty[key];
        if(v !== '' && v !== undefined && v !== null) return true;
      }
    }
    return false;
  }
  function itemTouched(item){
    const entries = state[item.code] || [];
    return entries.some(e => isEntryFilled(e, item));
  }

  function itemTotal(item){
    const entries = state[item.code] || [];
    let total = 0;
    for(const e of entries){
      const looseVal = Number(e.loose) || 0;
      if(item.ratioOptions){
        const ratio = Number(e.ratio) || item.ratioOptions[0];
        total += looseVal * (100 / ratio);
      } else {
        total += looseVal;
      }
      if(item.packages){
        item.packages.forEach((p, idx) => {
          const q = Number((e.packQty || {})[idx]) || 0;
          total += q * p.mult;
        });
      }
    }
    return item.ratioOptions ? Math.round(total) : total;
  }

  // ---------- ISO WEEK ----------
  function getISOWeek(date){
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }

  // ---------- RENDER ----------
  const root = document.getElementById('itemsRoot');

  function render(){
    root.innerHTML = '';
    ITEMS.forEach(item => {
      root.appendChild(renderItem(item));
    });
    updateProgress();
  }

  function updateProgress(){
    const filled = ITEMS.filter(it => itemTouched(it)).length;
    document.getElementById('progress').style.setProperty('--completion', (filled / ITEMS.length * 100) + '%');
    document.getElementById('progress').textContent = 'Uzupełniono ' + filled + ' / ' + ITEMS.length + ' pozycji';
  }

  function renderItem(item){
    const wrap = document.createElement('div');
    wrap.className = 'item';

    const head = document.createElement('div');
    head.className = 'item-head';
    const entries = ensureMinimumEntry(item);
    const touched = itemTouched(item);
    const total = itemTotal(item);
    head.innerHTML = `
      <div>
        <div class="item-name">${escapeHtml(item.name)}</div>
        <div class="item-code">nr ${item.code}</div>
      </div>
      <div class="item-total ${touched ? 'filled':''}" data-total="${item.code}">${touched ? total : '—'}</div>
    `;
    wrap.appendChild(head);

    const entriesRoot = document.createElement('div');
    entriesRoot.dataset.entriesFor = item.code;
    wrap.appendChild(entriesRoot);
    entries.forEach(entry => entriesRoot.appendChild(renderEntry(item, entry)));

    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.type = 'button';
    addBtn.textContent = '+ Dodaj kolejne miejsce';
    addBtn.addEventListener('click', () => {
      const e = newEntry(item);
      ensureItem(item.code).push(e);
      saveState();
      const container = wrap.querySelector('[data-entries-for="'+item.code+'"]');
      container.appendChild(renderEntry(item, e));
      refreshItemTotal(item);
      updateProgress();
      const newRow = container.lastElementChild;
      const firstInput = newRow ? newRow.querySelector('input') : null;
      if(firstInput) firstInput.focus();
    });
    wrap.appendChild(addBtn);

    return wrap;
  }

  function renderEntry(item, entry){
    const row = document.createElement('div');
    row.className = 'entry';
    row.dataset.entryId = entry.id;

    if(item.packages){
      item.packages.forEach((p, idx) => {
        const field = document.createElement('div');
        field.className = 'field';
        field.innerHTML = `<label>${escapeHtml(p.label)}</label>`;
        const input = document.createElement('input');
        input.type = 'number';
        input.inputMode = 'numeric';
        input.min = '0';
        input.placeholder = '0';
        input.value = (entry.packQty && entry.packQty[idx]) || '';
        input.addEventListener('input', () => {
          entry.packQty = entry.packQty || {};
          entry.packQty[idx] = input.value;
          saveState();
          refreshItemTotal(item);
        });
        field.appendChild(input);
        row.appendChild(field);
      });
    }

    if(item.ratioOptions){
      const field = document.createElement('div');
      field.className = 'field';
      field.innerHTML = `<label>Mnożnik</label>`;
      const select = document.createElement('select');
      item.ratioOptions.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = String(r).replace('.', ',') + ' cm = 100 szt';
        select.appendChild(opt);
      });
      select.value = entry.ratio || item.ratioOptions[0];
      select.addEventListener('change', () => {
        entry.ratio = select.value;
        saveState();
        refreshItemTotal(item);
      });
      field.appendChild(select);
      row.appendChild(field);
    }

    {
      const field = document.createElement('div');
      field.className = 'field';
      const looseLabel = item.packages ? 'Sztuki luzem' : UNIT_LABEL[item.unit];
      field.innerHTML = `<label>${escapeHtml(looseLabel)}</label>`;
      const input = document.createElement('input');
      input.type = 'number';
      input.inputMode = 'decimal';
      input.min = '0';
      input.step = item.step || '1';
      input.placeholder = '0';
      input.value = entry.loose || '';
      input.addEventListener('input', () => {
        entry.loose = input.value;
        saveState();
        refreshItemTotal(item);
      });
      field.appendChild(input);
      row.appendChild(field);
    }

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.type = 'button';
    del.setAttribute('aria-label','Usuń wpis');
    del.textContent = '✕';
    del.addEventListener('click', () => {
      const arr = ensureItem(item.code);
      const idx = arr.findIndex(e => e.id === entry.id);
      if(idx > -1) arr.splice(idx,1);
      if(arr.length === 0){
        const blank = newEntry(item);
        arr.push(blank);
        saveState();
        row.replaceWith(renderEntry(item, blank));
      } else {
        saveState();
        row.remove();
      }
      refreshItemTotal(item);
      updateProgress();
    });
    row.appendChild(del);

    return row;
  }

  function refreshItemTotal(item){
    updateProgress();
    const el = document.querySelector('[data-total="'+item.code+'"]');
    if(!el) return;
    const touched = itemTouched(item);
    if(touched){
      el.textContent = itemTotal(item);
      el.classList.add('filled');
    } else {
      el.textContent = '—';
      el.classList.remove('filled');
    }
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  // ---------- EKSPORT CSV ----------
  // delimiter ';'  -> plik CSV (Excel PL rozdziela kolumny średnikiem przy imporcie pliku)
  // delimiter '\t' -> wklejanie do schowka (Excel rozdziela kolumny przy wklejeniu tylko tabulatorem)
  function buildRow(delimiter){
    const group1 = ITEMS.filter(i => i.group === 1);
    const group2 = ITEMS.filter(i => i.group === 2);
    const values = [];

    group1.forEach(item => values.push(cellValue(item)));
    values.push('', ''); // 2 puste kolumny rozdzielające grupy
    group2.forEach(item => values.push(cellValue(item)));

    return values.join(delimiter);
  }
  function buildCsvRow(){ return buildRow(';'); }
  function buildClipboardRow(){ return buildRow('\t'); }

  function cellValue(item){
    if(!itemTouched(item)) return '0';
    return String(itemTotal(item));
  }

  function downloadFile(filename, content, mime){
    const blob = new Blob([content], { type: mime + ';charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function currentFilename(ext){
    const week = getISOWeek(new Date());
    const weekStr = String(week).padStart(2,'0');
    return 'RaportSetKW' + weekStr + '.' + ext;
  }

  function exportCsv(){
    const filename = currentFilename('csv');
    downloadFile(filename, buildCsvRow(), 'text/csv');
    showToast('Pobrano: ' + filename);
    closeSheet();
  }

  async function copyRow(){
    const text = buildClipboardRow();
    const btn = document.getElementById('btnCopy');
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
      } else {
        throw new Error('no clipboard api');
      }
      markCopied(btn);
    }catch(err){
      const ta = document.getElementById('copyTextarea');
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, 99999);
      try{
        document.execCommand('copy');
        markCopied(btn);
      }catch(e2){
        showToast('Nie udało się skopiować — zaznacz tekst ręcznie');
      }
    }
  }

  function markCopied(btn){
    showToast('Skopiowano — wklej w Excelu');
    if(btn){
      btn.classList.add('copied');
      setTimeout(() => btn.classList.remove('copied'), 1500);
    }
  }

  function sendMail(recipient){
    const week = getISOWeek(new Date());
    const weekStr = String(week).padStart(2,'0');
    const subject = 'Raport Tygodniowy MSY - KW' + weekStr;
    const body = buildCsvRow();
    const mailto = 'mailto:' + encodeURIComponent(recipient.email)
      + '?subject=' + encodeURIComponent(subject)
      + '&body=' + encodeURIComponent(body);
    window.location.href = mailto;
    closeSheet();
  }

  let toastTimer = null;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  // ---------- MENU WYSYŁKI (BOTTOM SHEET) ----------
  const sheetOverlay = document.getElementById('sheetOverlay');

  function openSheet(){
    const week = getISOWeek(new Date());
    document.getElementById('sheetSub').textContent = 'KW' + String(week).padStart(2,'0') + ' · ' + currentFilename('csv');
    document.getElementById('copyTextarea').value = buildClipboardRow();
    sheetOverlay.classList.add('open');
  }
  function closeSheet(){
    sheetOverlay.classList.remove('open');
  }

  const mailRecipientsRoot = document.getElementById('mailRecipients');
  RECIPIENTS.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'sheet-btn';
    btn.type = 'button';
    btn.innerHTML = `<span class="icon">✉</span><span>${escapeHtml(r.name)}<span class="lbl-sub">${escapeHtml(r.email)}</span></span>`;
    btn.addEventListener('click', () => sendMail(r));
    mailRecipientsRoot.appendChild(btn);
  });

  sheetOverlay.addEventListener('click', (e) => {
    if(e.target === sheetOverlay) closeSheet();
  });
  document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);
  document.getElementById('btnDownloadCsv').addEventListener('click', exportCsv);
  document.getElementById('btnCopy').addEventListener('click', copyRow);

  // ---------- POTWIERDZENIE CZYSZCZENIA ----------
  const confirmOverlay = document.getElementById('confirmOverlay');
  function openConfirmClear(){ confirmOverlay.classList.add('open'); }
  function closeConfirmClear(){ confirmOverlay.classList.remove('open'); }
  confirmOverlay.addEventListener('click', (e) => {
    if(e.target === confirmOverlay) closeConfirmClear();
  });
  document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirmClear);
  document.getElementById('confirmClearBtn').addEventListener('click', () => {
    state = {};
    saveState();
    render();
    closeConfirmClear();
    showToast('Wyczyszczono');
  });

  // ---------- INIT ----------
  document.getElementById('kwBadge').textContent = 'KW' + String(getISOWeek(new Date())).padStart(2,'0');
  document.getElementById('exportBtn').addEventListener('click', openSheet);
  document.getElementById('clearBtn').addEventListener('click', openConfirmClear);

  render();
})();
</script>
</body>
